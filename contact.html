<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Orbit Outreach</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="socialorbitlogo.png" sizes="32x32">
</head>
<body>
    <header>
        <div class="logo">
            <img src="orbit-outreach.png" alt="Orbit Outreach" class="logo-img">
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="plans.html">Plans</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="contact-section">
        <div class="contact-container">
            <!-- Left Side - Info -->
            <div class="contact-info">
                <h1>Get in Touch</h1>
                <p class="contact-subtitle">We'd love to hear from you!</p>
                <p class="contact-description">If you have any inquiries or just want to say hi, please use the contact form!</p>
                
                <div class="contact-details">
                    <div class="contact-item">
                        <span class="contact-icon">✉️</span>
                        <a href="mailto:orbitoutreachsocial@gmail.com">orbitoutreachsocial@gmail.com</a>
                    </div>
                    <div class="contact-item">
                        <span class="contact-icon">📱</span>
                        <span>Available Mon-Fri, 24/7</span>
                    </div>
                </div>

                <div class="social-links">
                    <a href="#" class="social-icon">📘</a>
                    <a href="#" class="social-icon">📸</a>
                    <a href="#" class="social-icon">🐦</a>
                    <a href="#" class="social-icon">💼</a>
                </div>
            </div>

            <!-- Right Side - Contact Form with Google Forms -->
            <div class="contact-form-wrapper">
                <form class="contact-form" action="https://docs.google.com/forms/d/e/1FAIpQLSdJXO0Oa_V1t6xS3ogn6ihQdHa0iFvnT5u3K6VYGUR2sSAbiA/formResponse" method="POST" target="hidden_iframe_contact" id="contactForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" name="entry.515157267" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" name="entry.524397003" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="entry.2108130004" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="entry.849447092" rows="5" required></textarea>
                    </div>
                    
                    <button type="submit" class="submit-button">Send</button>
                </form>
                
                <!-- Hidden iframe to prevent redirect -->
                <iframe name="hidden_iframe_contact" id="hidden_iframe_contact" style="display:none;"></iframe>
            </div>
        </div>
    </section>
    
    <script src="script.js"></script>
</body>
</html>
